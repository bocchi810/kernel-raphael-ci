# =============================================================================
#  Redmi K20 Pro / Mi 9T Pro (raphael / raphaelin, SM8150, Linux 4.14)
#  KernelSU Next + SUSFS + ccache  ->  AnyKernel3 可直刷 zip
#
#  默认源码 : SOVIET-ANDROID/kernel_xiaomi_raphael @ 16.0-SUSFS (4.14.357)
#  默认工具链: AOSP clang r547379 (crDroid prebuilt 镜像, 上游 CI 同款)
#  默认打包 : SOVIET-ANDROID/AnyKernel3 (devicecheck raphael/raphaelin)
# =============================================================================
name: Build Kernel · raphael

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "内核源码仓库 URL（留空=直接构建本仓库）"
        required: false
        default: ""
      kernel_branch:
        description: "源码分支/标签（仅当填了 kernel_repo 时使用）"
        required: false
        default: "16.0-SUSFS"
      defconfig:
        description: "defconfig 名称"
        required: false
        default: "raphael_defconfig"
      localversion:
        description: "内核版本后缀，如 SOVIET-STAR（留空=保持源码默认）"
        required: false
        default: ""
      ksu_enable:
        description: "启用 KernelSU Next"
        type: boolean
        default: true
      susfs_enable:
        description: "启用 SUSFS"
        type: boolean
        default: true
      hook_mode:
        description: "KernelSU hook 方式（4.14 必须用 manual）"
        type: choice
        options:
          - manual
          - kprobe
        default: manual
      ccache_enable:
        description: "启用 ccache"
        type: boolean
        default: true
      release:
        description: "构建成功后发布 GitHub Release"
        type: boolean
        default: false
      boot_img_url:
        description: "可选：你 ROM 的 boot.img 直链（也接受 ROM zip 直链，会自动取里面的 boot.img）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: kernel-raphael-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build raphael kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      DEFCONFIG_NAME: ${{ inputs.defconfig }}
      LOCALVERSION_SUFFIX: ${{ inputs.localversion }}
      HOOK_MODE: ${{ inputs.hook_mode }}
      KSU_ENABLE: ${{ inputs.ksu_enable }}
      SUSFS_ENABLE: ${{ inputs.susfs_enable }}
      CCACHE_ENABLE: ${{ inputs.ccache_enable }}
      # ---- 构建参数 ----
      KBUILD_BUILD_USER: gha
      KBUILD_BUILD_HOST: github-actions
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchain/clang-r547379
      CCACHE_COMPILERCHECK: "string:clang-r547379"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "2G"
    steps:
      # ---------------------------------------------------------------- 源码
      - name: Checkout (build repo)
        uses: actions/checkout@v4
        with:
          path: kernel
          fetch-depth: 1
          submodules: false

      - name: Checkout (external kernel source)
        if: inputs.kernel_repo != ''
        env:
          KREPO: ${{ inputs.kernel_repo }}
          KBRANCH: ${{ inputs.kernel_branch }}
        run: |
          set -euo pipefail
          rm -rf kernel
          git clone --depth=1 --branch "$KBRANCH" "$KREPO" kernel

      - name: Checkout (builder tools)
        if: inputs.kernel_repo != ''
        uses: actions/checkout@v4
        with:
          path: builder
          fetch-depth: 1
          sparse-checkout: |
            tools
            patches

      # 有些 A11/AOSP 树（PE eleven 等）没有内置 KernelSU Next：从上游 legacy 分支取 kernel/ 放进 drivers/kernelsu，
      # 并补上 SUSFS 需要、但上游没提供的 selinux 侧 glue（susfs_is_current_ksu_domain）。
      - name: Assemble KernelSU Next driver (if tree has none)
        if: inputs.ksu_enable
        env:
          KSU_SRC: https://github.com/KernelSU-Next/KernelSU-Next.git
          KSU_REF: legacy
        run: |
          set -euo pipefail
          cd kernel
          if [ -f drivers/kernelsu/Kconfig ]; then
            echo "tree already ships drivers/kernelsu, skip"
            exit 0
          fi
          echo "fetch KernelSU Next ($KSU_REF) -> drivers/kernelsu"
          git clone --depth 1 -b "$KSU_REF" "$KSU_SRC" "$RUNNER_TEMP/ksu" >/dev/null 2>&1
          rm -rf drivers/kernelsu
          cp -r "$RUNNER_TEMP/ksu/kernel" drivers/kernelsu
          # repo 里 kernel/include/uapi 是指向 <repo>/uapi 的相对软链，只拷 kernel/ 会变成悬空
          if [ -L drivers/kernelsu/include/uapi ] || [ ! -e drivers/kernelsu/include/uapi ]; then
            rm -f drivers/kernelsu/include/uapi
            cp -r "$RUNNER_TEMP/ksu/uapi" drivers/kernelsu/include/uapi
            cp -r "$RUNNER_TEMP/ksu/uapi" drivers/kernelsu/uapi
          fi
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/include/uapi/app_profile.h
          if ! grep -rq susfs_is_current_ksu_domain drivers/kernelsu; then
            echo "add SUSFS selinux glue to the driver"
            cat >> drivers/kernelsu/selinux/selinux.c <<'EOF'
          
          /* SUSFS: fs/susfs.c calls this to detect the ksu domain */
          bool susfs_is_current_ksu_domain(void)
          {
              return is_ksu_domain();
          }
          EOF
          fi
          # SUSFS 的 Kconfig 选项在 KSU Next 上游里没有（ReSukiSU 才有），补一份，否则 scripts/config -e 会被 olddefconfig 丢掉
          if ! grep -q "config KSU_SUSFS$" drivers/kernelsu/Kconfig; then
            cat >> drivers/kernelsu/Kconfig <<'EOF'
          
          menu "KernelSU - SUSFS"
          
          config KSU_SUSFS
          	bool "KernelSU addon - SUSFS"
          	depends on KSU
          	default y
          	help
          	  SUSFS (SU Hide File System) kernel-side implementation.
          
          config KSU_SUSFS_SUS_PATH
          	bool "Hide suspicious paths"
          	depends on KSU_SUSFS
          	default y
          
          config KSU_SUSFS_SUS_MOUNT
          	bool "Hide suspicious mounts"
          	depends on KSU_SUSFS
          	default y
          
          config KSU_SUSFS_SUS_KSTAT
          	bool "Hide or spoof kstat"
          	depends on KSU_SUSFS
          	default y
          
          config KSU_SUSFS_SPOOF_UNAME
          	bool "Spoof uname"
          	depends on KSU_SUSFS
          	default y
          
          config KSU_SUSFS_ENABLE_LOG
          	bool "Enable SUSFS logs"
          	depends on KSU_SUSFS
          	default y
          
          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          	bool "Hide KernelSU and SUSFS symbols"
          	depends on KSU_SUSFS
          	default y
          
          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          	bool "Spoof cmdline or bootconfig"
          	depends on KSU_SUSFS
          	default y
          
          config KSU_SUSFS_OPEN_REDIRECT
          	bool "Enable open redirect"
          	depends on KSU_SUSFS
          	default y
          
          config KSU_SUSFS_SUS_MAP
          	bool "Enable sus map"
          	depends on KSU_SUSFS
          	default y
          
          endmenu
          EOF
          fi
          grep -c "config KSU_SUSFS" drivers/kernelsu/Kconfig
          grep -rn susfs_is_current_ksu_domain drivers/kernelsu | head -3
          ls drivers/kernelsu

      - name: Inspect kernel source
        run: |
          set -euo pipefail
          cd kernel
          test -f Makefile || {
            echo "::error::kernel/Makefile 不存在：如果你用的是独立 builder 仓库，请在触发时填 kernel_repo。"
            exit 1
          }
          if [ ! -f "arch/arm64/configs/$DEFCONFIG_NAME" ] && [ ! -f "arch/arm64/configs/vendor/$DEFCONFIG_NAME" ]; then
            echo "::error::找不到 defconfig: $DEFCONFIG_NAME"
            find arch/arm64/configs -name "*_defconfig" | head -n 40
            exit 1
          fi
          KVER=$(awk -F" = " '/^VERSION =/{v=$2}/^PATCHLEVEL =/{p=$2}/^SUBLEVEL =/{s=$2}END{print v"."p"."s}' Makefile)
          echo "KERNEL_VERSION=$KVER" >> "$GITHUB_ENV"
          echo "KERNEL_COMMIT=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          if [ -z "$KERNEL_REPO" ]; then
            echo "KERNEL_BRANCH=${GITHUB_REF_NAME:-local}" >> "$GITHUB_ENV"
          fi
          KSU_GIT=$(awk -F" := " '/^KSU_GIT_VERSION/{print $2; exit}' drivers/kernelsu/Kbuild 2>/dev/null || true)
          if [[ "${KSU_GIT:-}" =~ ^[0-9]+$ ]]; then
            echo "KSU_VERSION=$((30000 + KSU_GIT + 150))" >> "$GITHUB_ENV"
          else
            echo "KSU_VERSION=unknown" >> "$GITHUB_ENV"
          fi
          echo "source : $(git remote get-url origin 2>/dev/null || echo local) @ $(git rev-parse --short=8 HEAD)"
          echo "version: $KVER"
          if [ "$KSU_ENABLE" = "true" ] && [ ! -f drivers/kernelsu/Kconfig ]; then
            echo "::error::该源码树没有内置 KernelSU Next（缺 drivers/kernelsu/Kconfig）。"
            echo "::error::请使用已集成 KSU-Next + SUSFS 的树（如 SOVIET 16.0-SUSFS / 15-susfs），或把 ksu_enable 设为 false。"
            exit 1
          fi

      # ---------------------------------------------------------------- 环境
      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git libelf-dev libncurses-dev \
            libssl-dev unzip zip wget libarchive-tools rsync python3 ca-certificates device-tree-compiler

      # CONFIG_COMPAT_VDSO=y 时 arm64 的 Makefile 强制要求 CROSS_COMPILE_ARM32，
      # 否则直接 `*** CROSS_COMPILE_ARM32 not defined or empty` 退出（4.14 arch/arm64/Makefile:75）
      - name: Install cross toolchains (aarch64 + arm32)
        run: |
          set -uo pipefail
          # 这棵树是 4.14.190 原生树，没有 LLVM=1 支持：clang 只有在 CROSS_COMPILE 非空时
          # 才从 CLANG_TRIPLE 拿到 --target，否则按宿主 x86_64 编译（报 register 'sp' unsuitable）
          if sudo apt-get install -y --no-install-recommends \
               gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
               gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu; then
            echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
            echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
            echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
            arm-linux-gnueabi-gcc --version | head -n 1
            aarch64-linux-gnu-ld --version | head -n 1
          else
            echo "::error::交叉工具链安装失败"; exit 1
          fi

      - name: Restore clang r547379 cache
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: clang-r547379-v1

      - name: Download clang r547379
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$TOOLCHAIN_DIR")"
          git clone --depth=1 --branch 15.0 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
            "$TOOLCHAIN_DIR"
          rm -rf "$TOOLCHAIN_DIR/.git"

      - name: Save clang cache
        if: steps.clang-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: clang-r547379-v1

      - name: Add clang to PATH
        run: |
          set -euo pipefail
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          "$TOOLCHAIN_DIR/bin/clang" --version | head -n 2

      # 直接用 actions/cache 管 .ccache：hendrikmuhs/ccache-action 会给 key 再加一层 "ccache-" 前缀，
      # 保存成 ccache-ccache-raphael-...，而 restore-keys 是 ccache-raphael-...，永远匹配不上（实测每次 No cache found）。
      - name: Restore ccache
        if: inputs.ccache_enable
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-raphael-${{ env.DEFCONFIG_NAME }}-${{ env.KERNEL_BRANCH }}-${{ github.sha }}
          restore-keys: |
            ccache-raphael-${{ env.DEFCONFIG_NAME }}-${{ env.KERNEL_BRANCH }}-
            ccache-raphael-${{ env.DEFCONFIG_NAME }}-

      - name: Prepare ccache
        if: inputs.ccache_enable
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --zero-stats
          ccache --show-config | grep -E 'cache_dir|max_size|compression' || true

      - name: Select compiler wrapper
        run: |
          if [ "$CCACHE_ENABLE" = "true" ]; then
            echo "CC_VALUE=ccache clang" >> "$GITHUB_ENV"
          else
            echo "CC_VALUE=clang" >> "$GITHUB_ENV"
          fi
          echo "compiler wrapper: $( [ "$CCACHE_ENABLE" = "true" ] && echo ccache || echo none )"
          # 4.14 + QC 的 techpack Kbuild 里写死了 -Werror，clang 19 多出来的告警会直接把老代码判死；
          # KCFLAGS 追加在 KBUILD_CFLAGS 末尾，能压掉前面 -Werror / -Werror=xxx
          KC="-Wno-error"
          for w in strict-prototypes unused-but-set-variable unused-value implicit-function-declaration implicit-int int-conversion incompatible-pointer-types incompatible-function-pointer-types return-mismatch misleading-indentation address-of-packed-member declaration-after-statement; do
            KC="$KC -Wno-error=$w"
          done
          echo "EXTRA_KCFLAGS=$KC" >> "$GITHUB_ENV"
          echo "extra cflags: $KC"

      # ---------------------------------------------------------------- 补丁
      - name: Apply local patches (patches/*.patch)
        if: hashFiles('patches/*.patch', 'kernel/patches/*.patch', 'builder/patches/*.patch') != ''
        run: |
          set -euo pipefail
          cd kernel
          shopt -s nullglob
          PATCHES=(../patches/*.patch ../builder/patches/*.patch patches/*.patch)
          [ ${#PATCHES[@]} -gt 0 ] || { echo "没有补丁，跳过"; exit 0; }
          for p in "${PATCHES[@]}"; do
            echo "==> applying $(basename "$p")"
            patch -p1 --forward --batch --fuzz=3 --no-backup-if-mismatch < "$p"
          done

      # ---------------------------------------------------------------- 配置
      - name: Configure kernel (KernelSU Next + SUSFS)
        run: |
          set -euo pipefail
          cd kernel
          make LLVM=1 LLVM_IAS=1 O=out ARCH=arm64 "$DEFCONFIG_NAME"

          if [ "$KSU_ENABLE" = "true" ]; then
            KCONF=drivers/kernelsu/Kconfig
            mapfile -t SUSFS_OPTS < <(grep -E "^[[:space:]]*config[[:space:]]+KSU_SUSFS" "$KCONF" | awk '{print $2}')
            echo "SUSFS options in tree: ${SUSFS_OPTS[*]:-<none>}"

            ./scripts/config --file out/.config -e KSU
            for opt in "${SUSFS_OPTS[@]}"; do
              ./scripts/config --file out/.config -e "$opt"
            done

            case "$HOOK_MODE" in
              manual)
                ./scripts/config --file out/.config -e KSU_MANUAL_HOOK
                ./scripts/config --file out/.config -d KSU_KPROBES_HOOK
                ;;
              kprobe)
                ./scripts/config --file out/.config -d KSU_MANUAL_HOOK
                ./scripts/config --file out/.config -e KSU_KPROBES_HOOK
                ;;
              *)
                echo "::error::未知 hook_mode: $HOOK_MODE"; exit 1
                ;;
            esac

            if [ "$SUSFS_ENABLE" != "true" ]; then
              ./scripts/config --file out/.config -d KSU_SUSFS
              for opt in "${SUSFS_OPTS[@]}"; do
                ./scripts/config --file out/.config -d "$opt"
              done
            fi
          else
            ./scripts/config --file out/.config -d KSU
          fi

          if [ -n "$LOCALVERSION_SUFFIX" ]; then
            ./scripts/config --file out/.config --set-str LOCALVERSION "-${LOCALVERSION_SUFFIX}"
          fi

          # 没有 arm32 交叉工具链就必须关 COMPAT_VDSO，否则 arm64 Makefile 解析阶段直接报错
          if [ -z "${CROSS_COMPILE_ARM32:-}" ] && grep -q "^CONFIG_COMPAT_VDSO=y" out/.config; then
            echo "::warning::未装 arm32 工具链，关闭 CONFIG_COMPAT_VDSO（32 位进程仍可运行，只是没有 vDSO）"
            ./scripts/config --file out/.config -d COMPAT_VDSO
          fi

          make LLVM=1 LLVM_IAS=1 O=out ARCH=arm64 olddefconfig

          echo "---- 关键配置 ----"
          grep -E "^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_KPROBES_HOOK|CONFIG_KPROBES|CONFIG_THREAD_INFO_IN_TASK|CONFIG_LOCALVERSION)=" out/.config || true
          echo "------------------"

          rc=0
          if [ "$KSU_ENABLE" = "true" ]; then
            grep -qx "CONFIG_KSU=y" out/.config || { echo "::error::CONFIG_KSU 没有生效"; rc=1; }
            if [ "$SUSFS_ENABLE" = "true" ]; then
              grep -qx "CONFIG_KSU_SUSFS=y" out/.config || {
                echo "::error::CONFIG_KSU_SUSFS 没有生效：确认 arm64 已 select THREAD_INFO_IN_TASK，且树里有 SUSFS 代码"; rc=1; }
            fi
            if [ "$HOOK_MODE" = "manual" ]; then
              grep -qx "CONFIG_KSU_MANUAL_HOOK=y" out/.config || { echo "::error::CONFIG_KSU_MANUAL_HOOK 没有生效"; rc=1; }
            fi
          fi
          exit $rc

      # ---------------------------------------------------------------- 编译
      - name: Build kernel
        run: |
          set -euo pipefail
          cd kernel
          echo "CC=$CC_VALUE  JOBS=$(nproc)  VERSION=$KERNEL_VERSION"
          # 树内自带的 dtc 是 1.4.4，解析不了 QCOM overlay 里的 &label 片段（raphael-pinctrl.dtsi:2 直接 syntax error）
          make LLVM=1 LLVM_IAS=1 O=out ARCH=arm64 CC="$CC_VALUE" KCFLAGS="$EXTRA_KCFLAGS" DTC=/usr/bin/dtc -j"$(nproc)"
          echo "KERNEL_RELEASE=$(cat out/include/config/kernel.release 2>/dev/null || echo unknown)" >> "$GITHUB_ENV"

      - name: Diagnose vmlinux layout on failure
        if: failure()
        run: |
          set +e
          V=kernel/out/.tmp_vmlinux1
          ls -la "$V" || exit 0
          echo '--- 最低地址符号（relative_base 候选）---'
          aarch64-linux-gnu-nm -n "$V" | head -5
          echo '--- 关键符号 ---'
          aarch64-linux-gnu-nm "$V" | grep -E ' (_text|_stext|__init_begin|__per_cpu_start|__per_cpu_end|_sdata|_edata|_end|__bss_start|__bss_stop|__bss_rtic_start)$'
          echo '--- 地址为 0 的符号 ---'
          aarch64-linux-gnu-nm "$V" | awk '$1=="0000000000000000"{print}' | head -10
          echo '--- 段表 ---'
          aarch64-linux-gnu-readelf -SW "$V" | grep -E '      \.(text|data|bss|notes|percpu|init)' | head -20
          echo '--- 程序头 ---'
          aarch64-linux-gnu-readelf -lW "$V" | head -30

      - name: ccache statistics
        if: always() && inputs.ccache_enable
        run: |
          ccache --show-stats --verbose || ccache --show-stats || true

      # ---------------------------------------------------------------- 打包
      - name: Package AnyKernel3 zip
        id: package
        run: |
          set -euo pipefail
          IMG=kernel/out/arch/arm64/boot
          test -f "$IMG/Image.gz-dtb" || { echo "::error::缺少 Image.gz-dtb"; ls -l "$IMG"; exit 1; }

          git clone --depth=1 https://github.com/SOVIET-ANDROID/AnyKernel3.git ak3
          rm -rf ak3/.git
          cp -f "$IMG/Image.gz-dtb" ak3/
          # 有的树（如 PE eleven 4.14）不产出 dtbo.img：那就别把 dtbo 塞进 zip，也别让 anykernel.sh 去刷它
          if [ -f "$IMG/dtbo.img" ]; then
            cp -f "$IMG/dtbo.img" ak3/
          else
            echo "本树没有 dtbo.img：跳过 dtbo 分区，并关掉 anykernel.sh 里的 flash_dtbo"
            sed -i -E 's/^[[:space:]]*flash_dtbo;/# flash_dtbo; # dtbo.img 未生成/' ak3/anykernel.sh
            grep -n 'flash_' ak3/anykernel.sh || true
          fi

          NAME="raphael-${KERNEL_BRANCH}-${KERNEL_VERSION}-${KERNEL_COMMIT}-$(date -u +%Y%m%d-%H%M)"
          ( cd ak3 && zip -r9 "../${NAME}.zip" * )
          mkdir -p dist && cp -f "${NAME}.zip" dist/
          echo "ZIP_NAME=${NAME}.zip" >> "$GITHUB_OUTPUT"
          ls -lh "dist/${NAME}.zip"
          unzip -l "dist/${NAME}.zip" | tail -n 12

      # ---------------------------------------------------------------- boot.img
      # 内核本身不能凭空变成可刷 boot.img：必须拿你 ROM 的 boot.img 当底包（ramdisk/cmdline/偏移都沿用它的），
      # 只把里面的 kernel 换成本次编译产物。底包来源：仓库 donors/boot.img，或输入 boot_img_url。
      - name: Prepare donor boot.img
        id: donor
        if: inputs.boot_img_url != '' || hashFiles('donors/boot.img') != ''
        env:
          BOOT_IMG_URL: ${{ inputs.boot_img_url }}
        run: |
          set -euo pipefail
          mkdir -p donor
          if [ -n "$BOOT_IMG_URL" ]; then
            curl -fL --retry 3 --max-time 900 -o donor/download "$BOOT_IMG_URL"
          else
            cp donors/boot.img donor/download
          fi
          SRC=donor/download
          # 直接给 ROM zip 也认：从根目录取 boot.img
          if [ "$(head -c 2 "$SRC")" = "PK" ]; then
            echo "输入是 zip 包，从里面取 boot.img"
            SRC=$(python3 - "$SRC" <<'PY'
          import sys, zipfile, os
          src = sys.argv[1]
          with zipfile.ZipFile(src) as z:
              names = [n for n in z.namelist() if os.path.basename(n) == "boot.img"]
              if not names:
                  sys.exit(1)
              names.sort(key=lambda n: n.count("/"))
              os.makedirs("donor/extract", exist_ok=True)
              out = os.path.join("donor/extract", "boot.img")
              with z.open(names[0]) as f, open(out, "wb") as g:
                  g.write(f.read())
              print(out)
          PY
            ) || true
          fi
          if [ ! -s "$SRC" ] || [ "$(head -c 8 "$SRC")" != "ANDROID!" ]; then
            echo "::error::底包里取不到 boot.img（或者不是 Android boot image）：$SRC"
            exit 1
          fi
          mv "$SRC" donor/boot.img
          ls -lh donor/boot.img
          echo "DONOR=donor/boot.img" >> "$GITHUB_ENV"
          echo "donor=1" >> "$GITHUB_OUTPUT"

      - name: Repack boot.img with built kernel
        if: steps.donor.outputs.donor == '1'
        run: |
          set -euo pipefail
          mkdir -p dist
          WORK="$RUNNER_TEMP/bootrepack"
          rm -rf "$WORK" && mkdir -p "$WORK" && cd "$WORK"
          # 用外部内核源时，本仓库自己的 tools/ 已经被 rm -rf kernel 删掉，改从 builder/ 里取
          MKTOOLS=""
          for d in "$GITHUB_WORKSPACE/builder/tools/mkbootimg" "$GITHUB_WORKSPACE/kernel/tools/mkbootimg" "$GITHUB_WORKSPACE/tools/mkbootimg"; do
            if [ -f "$d/mkbootimg.py" ]; then MKTOOLS="$d"; break; fi
          done
          [ -n "$MKTOOLS" ] || { echo "::error::找不到 tools/mkbootimg（builder 仓库里应该有）"; exit 1; }
          echo "boot tools: $MKTOOLS"
          python3 "$MKTOOLS/unpack_bootimg.py" --boot_img "$GITHUB_WORKSPACE/$DONOR" --out unpacked
          # 先把 mkbootimg 参数取出来；注意这一步会重新解包到 unpacked/，必须在替换内核之前做
          ARGS=$(python3 "$MKTOOLS/unpack_bootimg.py" --boot_img "$GITHUB_WORKSPACE/$DONOR" --out unpacked --format=mkbootimg)
          KERNEL="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb"
          DK_MAGIC=$(head -c 16 unpacked/kernel)
          if [ "$DK_MAGIC" = "UNCOMPRESSED_IMG" ]; then
            echo "底包是小米 UNCOMPRESSED_IMG 容器（Image 不压缩 + 长度 + dtb），按同格式重打包"
            python3 - "$KERNEL" unpacked/kernel <<'PY'
          import sys, zlib, struct
          src, dst = sys.argv[1], sys.argv[2]
          d = zlib.decompressobj(31)
          image = d.decompress(open(src, "rb").read())
          dtb = d.unused_data
          if not image:
              sys.exit("gunzip failed: " + src)
          with open(dst, "wb") as f:
              f.write(b"UNCOMPRESSED_IMG")
              f.write(struct.pack("<I", len(image)))
              f.write(image)
              f.write(dtb)
          print("uncompressed image", len(image), "dtb", len(dtb))
          PY
          else
            cp "$KERNEL" unpacked/kernel
            K_MAGIC=$(head -c 2 unpacked/kernel | od -An -tx1 | tr -d " \n")
            B_MAGIC=$(head -c 2 "$KERNEL" | od -An -tx1 | tr -d " \n")
            if [ "$K_MAGIC" != "$B_MAGIC" ]; then
              echo "::error::内核压缩格式与底包不一致 donor=$K_MAGIC build=$B_MAGIC"
              exit 1
            fi
          fi
          OUT="$GITHUB_WORKSPACE/dist/boot-${KERNEL_VERSION}-${KERNEL_COMMIT}-$(date -u +%Y%m%d-%H%M).img"
          eval "python3 \"$MKTOOLS/mkbootimg.py\" $ARGS -o \"$OUT\""
          VERIFY=$(python3 "$MKTOOLS/unpack_bootimg.py" --boot_img "$OUT" --out verify)
          echo "$VERIFY" | head -n 20
          GOT=$(echo "$VERIFY" | awk '/^kernel_size:/ {print $2}')
          WANT=$(stat -c %s unpacked/kernel)
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::重打包后 kernel_size=$GOT，期望 $WANT —— 内核没有被替换进去"
            exit 1
          fi
          echo "BOOT_IMG=$(basename "$OUT")" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ZIP_NAME }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('raphael-{0}', github.run_number) }}
          name: ${{ steps.package.outputs.ZIP_NAME }}
          files: ${{ steps.package.outputs.ZIP_NAME }}
          generate_release_notes: true

      - name: Summary
        if: always()
        run: |
          {
            echo "## raphael kernel build"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| kernel | $KERNEL_VERSION ($KERNEL_COMMIT) |"
            echo "| release | $KERNEL_RELEASE |"
            echo "| branch | $KERNEL_BRANCH |"
            echo "| defconfig | $DEFCONFIG_NAME |"
            echo "| KSU / SUSFS | $KSU_ENABLE / $SUSFS_ENABLE (hook: $HOOK_MODE) |"
            echo "| ccache | $CCACHE_ENABLE |"
            echo "| AK3 zip | ${{ steps.package.outputs.ZIP_NAME }} |"
            echo "| boot.img | ${BOOT_IMG:-未产出（没给 donor）} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CCACHE_ENABLE" = "true" ]; then
            { echo ""; echo "<details><summary>ccache stats</summary>"; echo ""; echo "```"; ccache --show-stats || true; echo "```"; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"
          fi
