# SUSFS CI · 红米 K20 Pro (raphael) · Evolution-X 内核源 + KernelSU Next + SUSFS
# 调用的引擎见 build-evolutionx.yml；SUSFS 代码来自 patches/susfs/（v2.1.0，取自 SOVIET 16.0-SUSFS）
name: CI - SUSFS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-evolutionx.yml
      - .github/workflows/ci-susfs.yml
      - patches/susfs/**
      - ak3/**

permissions:
  contents: write

concurrency:
  group: ci-susfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  susfs:
    name: KernelSU Next + SUSFS
    uses: ./.github/workflows/build-evolutionx.yml
    with:
      flavor: susfs
      kernel_repo: https://github.com/Evolution-X-Devices/kernel_xiaomi_raphael
      kernel_ref: cnb
      defconfig: vendor/sm8150-perf_defconfig
      fragments: vendor/xiaomi/sm8150-common.config vendor/xiaomi/raphael.config
      ccache_enable: true
